[project]
name = "agriculture-climat-wallonie"
version = "0.1.0"
description = "Sensibilité des rendements agricoles wallons à la variabilité climatique."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16.0",
    "matplotlib>=3.9",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "streamlit>=1.38",
    "plotly>=5.24",
    "requests>=2.32",
    "truststore>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ipykernel>=6.29",
]

[project.scripts]
agri-climat = "agri_climat.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
